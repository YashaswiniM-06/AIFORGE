<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="800" viewBox="0 0 1260 800" role="img" aria-labelledby="title desc">
  <title id="title">Fieldday Original Oat Drink — sample front and back packaging artwork</title>
  <desc id="desc">Fictional oat drink label layout for demonstrating evidence markers. The front says 750 millilitres and No Added Sugar. The back shows ingredients but omits the sample checklist's required storage statement.</desc>
  <defs>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="4" r=".7" fill="#6c7b61" opacity=".13"/><circle cx="13" cy="12" r=".65" fill="#786e50" opacity=".1"/></pattern>
    <linearGradient id="field" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#eef1df"/><stop offset="1" stop-color="#e4ead4"/></linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcfaf3"/><stop offset="1" stop-color="#f4f1e7"/></linearGradient>
  </defs>
  <rect width="1260" height="800" fill="#ecefe9"/>
  <text x="39" y="40" fill="#8b958b" font-family="'DM Mono', monospace" font-size="12" letter-spacing="2">NORTHSTAR FOODS  /  PACKAGING ARTWORK REVIEW</text>
  <text x="1219" y="40" text-anchor="end" fill="#8b958b" font-family="'DM Mono', monospace" font-size="12" letter-spacing="1.5">FIELD DAY OAT  /  V07  /  15 OCT 2026</text>
  <path d="M40 57H1220" stroke="#d7ded6"/>

  <!-- Front panel -->
  <g>
    <rect x="40" y="86" width="500" height="650" rx="3" fill="url(#field)" stroke="#d6decc"/>
    <rect x="40" y="86" width="500" height="650" rx="3" fill="url(#grain)"/>
    <path d="M40 108Q40 86 62 86H518Q540 86 540 108V99H40Z" fill="#526c46"/>
    <text x="73" y="145" fill="#41573a" font-family="Georgia, serif" font-size="25" font-weight="700" letter-spacing="-1">fieldday</text>
    <text x="75" y="163" fill="#77856a" font-family="'DM Mono', monospace" font-size="8" letter-spacing="2.4">GOOD THINGS GROW SLOW</text>
    <path d="M436 125h68" stroke="#bcc8ad" stroke-width="1"/>
    <circle cx="475" cy="145" r="15" fill="#f6f4e8" stroke="#b3c0a2"/>
    <path d="M469 147q6-12 12-5q-1 8-12 5Zm5-10q0-5 4-7" fill="none" stroke="#668456" stroke-width="1.5" stroke-linecap="round"/>
    <text x="73" y="224" fill="#6f805e" font-family="'DM Mono', monospace" font-size="9" letter-spacing="2.6">PLANT-BASED  /  ORIGINAL</text>
    <text x="70" y="313" fill="#2c4737" font-family="Georgia, serif" font-size="82" letter-spacing="-4">Oat</text>
    <text x="76" y="354" fill="#4e6650" font-family="'DM Sans', sans-serif" font-size="22" letter-spacing="7" font-weight="500">DRINK</text>
    <path d="M75 375h140" stroke="#a9b69b"/>
    <text x="75" y="405" fill="#708064" font-family="'DM Sans', sans-serif" font-size="13">A smooth, everyday oat drink.</text>
    <text x="75" y="424" fill="#708064" font-family="'DM Sans', sans-serif" font-size="13">Made for your morning ritual.</text>
    <!-- Oat stem illustration -->
    <g transform="translate(326 227)" fill="none" stroke="#7a9464" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 211C34 154 49 104 67 43"/><path d="M36 162C12 155 2 139 4 126c20 2 32 12 35 29Zm10-37c-17-9-23-24-18-36 18 7 26 18 24 35Zm13-37c-12-12-14-27-6-37 15 10 20 22 13 37Z"/>
      <path d="M51 112c17-20 35-23 48-14-11 19-27 27-49 22Zm9-36c15-19 30-23 43-15-9 17-23 26-46 24Z"/>
      <path d="M67 51c-17-10-21-23-15-34 17 5 25 16 23 34Zm4 4c17-11 31-10 38-1-12 13-24 17-39 8Z"/>
      <path d="M32 176c22 1 37 12 39 25-22 4-38-4-47-21Z" opacity=".75"/>
      <path d="M23 211c19 0 35 2 51 10" stroke="#b7a66a"/>
    </g>
    <g fill="#a99d69" opacity=".82"><ellipse cx="369" cy="280" rx="4" ry="8" transform="rotate(-24 369 280)"/><ellipse cx="384" cy="258" rx="4" ry="8" transform="rotate(-34 384 258)"/><ellipse cx="398" cy="237" rx="4" ry="8" transform="rotate(13 398 237)"/><ellipse cx="411" cy="282" rx="4" ry="8" transform="rotate(36 411 282)"/><ellipse cx="425" cy="267" rx="4" ry="8" transform="rotate(31 425 267)"/></g>
    <rect x="72" y="459" width="188" height="30" rx="15" fill="#fbfaf2" stroke="#cbd5bd"/>
    <circle cx="89" cy="474" r="3" fill="#95a978"/>
    <text data-evidence="claim" x="101" y="478" fill="#58714c" font-family="'DM Mono', monospace" font-size="9" letter-spacing=".8">NO ADDED SUGAR</text>
    <path d="M73 574h432" stroke="#c5ceba"/>
    <text x="75" y="608" fill="#78876a" font-family="'DM Mono', monospace" font-size="8" letter-spacing="1.8">GOODNESS, IN ITS OWN TIME</text>
    <text data-evidence="net-quantity" x="75" y="699" fill="#324c3a" font-family="Georgia, serif" font-size="26" font-weight="700">750 mL</text>
    <text x="76" y="717" fill="#819078" font-family="'DM Sans', sans-serif" font-size="8">Plant-based oat beverage</text>
    <circle cx="473" cy="691" r="24" fill="#e8eddd" stroke="#bbc9ad"/>
    <text x="473" y="689" text-anchor="middle" fill="#60764f" font-family="'DM Mono', monospace" font-size="7">MADE</text>
    <text x="473" y="699" text-anchor="middle" fill="#60764f" font-family="'DM Mono', monospace" font-size="7">WITH OATS</text>
  </g>

  <!-- Back panel -->
  <g>
    <rect x="580" y="86" width="640" height="650" rx="3" fill="url(#back)" stroke="#e2dfd4"/>
    <rect x="580" y="86" width="640" height="7" fill="#526c46"/>
    <text x="614" y="137" fill="#41573a" font-family="Georgia, serif" font-size="23" font-weight="700">A little more plant in your day.</text>
    <text x="614" y="161" fill="#7a8173" font-family="'DM Sans', sans-serif" font-size="11">A simple oat drink for coffee, cereal, or a glass on its own.</text>
    <path d="M614 181h572" stroke="#dedfd5"/>
    <text x="614" y="211" fill="#6b7d5f" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1.4">INGREDIENTS</text>
    <text x="614" y="232" fill="#454f44" font-family="'DM Sans', sans-serif" font-size="11">Water, oats (12%), sunflower oil, sea salt.</text>
    <text x="614" y="264" fill="#6b7d5f" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1.4">ALLERGEN INFORMATION</text>
    <text x="614" y="285" fill="#454f44" font-family="'DM Sans', sans-serif" font-size="11">Contains oats.</text>
    <path d="M614 303h572" stroke="#dedfd5"/>
    <text x="614" y="332" fill="#6b7d5f" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1.4">TYPICAL VALUES</text>
    <text x="614" y="351" fill="#7e8579" font-family="'DM Sans', sans-serif" font-size="9">Average nutritional information per 100 mL</text>
    <rect x="614" y="365" width="572" height="24" fill="#e9ebdf"/>
    <text x="624" y="381" fill="#56634f" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700">Nutrient</text>
    <text x="1176" y="381" text-anchor="end" fill="#56634f" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700">Per 100 mL</text>
    <g font-family="'DM Sans', sans-serif" font-size="9" fill="#626b5e">
      <text x="624" y="406">Energy</text><text x="1176" y="406" text-anchor="end">196 kJ / 47 kcal</text>
      <text x="624" y="429">Fat</text><text x="1176" y="429" text-anchor="end">1.5 g</text>
      <text x="624" y="452">of which saturates</text><text x="1176" y="452" text-anchor="end">0.2 g</text>
      <text x="624" y="475">Carbohydrate</text><text x="1176" y="475" text-anchor="end">7.2 g</text>
      <text x="624" y="498">of which sugars</text><text x="1176" y="498" text-anchor="end">3.8 g</text>
      <text x="624" y="521">Protein</text><text x="1176" y="521" text-anchor="end">1.1 g</text>
      <text x="624" y="544">Salt</text><text x="1176" y="544" text-anchor="end">0.10 g</text>
    </g>
    <g stroke="#e4e5dc"><path d="M614 413h572"/><path d="M614 436h572"/><path d="M614 459h572"/><path d="M614 482h572"/><path d="M614 505h572"/><path d="M614 528h572"/><path d="M614 551h572"/></g>
    <text x="614" y="584" fill="#6b7d5f" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1.4">MADE FOR NORTHSTAR FOODS</text>
    <text x="614" y="602" fill="#71796e" font-family="'DM Sans', sans-serif" font-size="9">12 Field Lane, Bengaluru 560001</text>
    <text x="614" y="617" fill="#71796e" font-family="'DM Sans', sans-serif" font-size="9">Care: hello@fieldday.example</text>
    <path d="M614 636h572" stroke="#dedfd5"/>
    <!-- Intentionally blank storage copy area — see sample review finding -->
    <text x="614" y="661" fill="#9b9b8f" font-family="'DM Mono', monospace" font-size="7" letter-spacing="1.1">PACKAGE CARE</text>
    <g transform="translate(1047 669)" fill="none" stroke="#87907f" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0h27l-2 34H3Z"/><path d="M-2 0h31M8-5h11M7 8l7 7m0-7-7 7m13 8-5 5m0-5 5 5"/>
    </g>
    <g transform="translate(1100 670)" fill="none" stroke="#87907f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 0v28M12 0C2 6 2 15 12 19m0-12c10 5 10 13 0 17"/>
      <path d="M5 28h14"/>
    </g>
    <text x="614" y="708" fill="#a0a296" font-family="'DM Sans', sans-serif" font-size="8">FSC MIX · carton recyclable where facilities exist</text>
  </g>

  <text x="40" y="771" fill="#929b92" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1.2">DEMO ARTWORK — FICTIONAL BRAND / PRODUCT / CHECKLIST</text>
  <text x="1220" y="771" text-anchor="end" fill="#929b92" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1.2">FRONT PANEL  ·  BACK PANEL</text>
</svg>
